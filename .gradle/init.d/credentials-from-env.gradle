// Work builds read GitHub Packages credentials with findProperty("maven.password") and similar keys.
// Gradle cannot take these names from ORG_GRADLE_PROJECT_* variables, because zsh cannot export names with dots.
// The token lives only in the shell environment (dotfiles _shared secrets), not in ~/.gradle/gradle.properties.
def credentials = [
    'maven.username' : 'GITHUB_USER',
    'maven.password' : 'GITHUB_TOKEN',
    'docker.username': 'GITHUB_USER',
    'docker.password': 'GITHUB_TOKEN',
]

// A missing variable leaves the property unset, so builds that do not use it still run.
beforeProject { project ->
    credentials.each { property, variable ->
        def value = System.getenv(variable)
        if (value) {
            project.extensions.extraProperties.set(property, value)
        }
    }
}
