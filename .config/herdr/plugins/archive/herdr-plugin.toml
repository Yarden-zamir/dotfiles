id = "yarden.archive"
name = "Archive"
version = "0.2.1"
min_herdr_version = "0.8.2"
description = "Move panes to an archive workspace instead of closing them"
platforms = ["macos", "linux"]

# archive.py holds the whole logic; see its docstring. run.sh sets PATH and
# starts it with uv (see run.sh for why). Config knobs live in
# $HERDR_PLUGIN_CONFIG_DIR/archive.toml (label, max_age_days, toasts,
# focus_on_restore). Toast clicks need the fork build (notification action).

# Reap old panes and move the archive workspace to the sidebar end.
[[startup]]
command = ["sh", "run.sh", "startup"]

# Keep the archive workspace last when spaces are created or reordered.
[[events]]
on = "workspace.created"
command = ["sh", "run.sh", "pin-last"]

[[events]]
on = "workspace.moved"
command = ["sh", "run.sh", "pin-last"]

[[actions]]
id = "archive"
title = "Archive pane"
description = "Move the focused pane to the archive space instead of closing it."
contexts = ["pane"]
command = ["sh", "run.sh", "archive"]

[[actions]]
id = "restore-last"
title = "Restore last archived pane"
description = "Move the newest archived pane back to its origin space."
contexts = ["workspace", "tab", "pane"]
command = ["sh", "run.sh", "restore-last"]

[[actions]]
id = "restore-pick"
title = "Restore an archived pane (pick)"
description = "Pick an archived pane in a popup and move it back to its origin space."
contexts = ["workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin yarden.archive --entrypoint pick"]

[[actions]]
id = "clear"
title = "Close all archived panes"
description = "Close the archive space and every pane in it."
contexts = ["workspace", "tab", "pane"]
command = ["sh", "run.sh", "clear"]

[[actions]]
id = "reap"
title = "Close archived panes older than max_age_days"
description = "Close archived panes older than max_age_days from archive.toml."
contexts = ["workspace", "tab", "pane"]
command = ["sh", "run.sh", "reap"]

[[panes]]
id = "pick"
title = "Restore archived pane"
platforms = ["macos", "linux"]
placement = "popup"
width = "60%"
height = "50%"
command = ["sh", "run.sh", "restore-pick"]
